    model_selection: Subject to Claude Code capabilities and user entitlement.
    entitlement_behavior: Preferred path when preserving native Claude Pro or Max plan usage is required.
    side_effect_semantics: Must be declared by the concrete adapter and driver path before certification.
    known_limitations:
      Exact ACP integration and support matrix remain to be validated during the desktop RuntimeNode feasibility
