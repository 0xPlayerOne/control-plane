      may be required otherwise.
    adapter: ACPAdapter_or_specialized
    driver: ACPDriver
    runtime_node_locations:
      - local_device
    runtime_gateway:
      required: true
      purpose: Agent HQ-controlled local execution and supported session operations.
    authentication: Native Claude Code authentication remains owned by Claude Code.
    sessions:
      list: Capability-dependent and must be negotiated and verified.
      resume: Capability-dependent; ACP resume reconnects without implying history replay.
      history_replay: Not implied by ACP resume; requires a separately exposed capability or adapter support.
    tools: Native Claude Code tools remain harness-owned; only advertised and authorized capabilities are surfaced.
    filesystem_shell:
      Native project access may exist, but Agent HQ requires negotiated capabilities and an active LocalProjectGrant
