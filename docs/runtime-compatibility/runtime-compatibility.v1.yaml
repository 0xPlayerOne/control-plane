# Machine-readable companion to the canonical Runtime Compatibility Matrix.
schema_version: 1
updated_at: '2026-08-25'
owner: Control Plane runtime architecture
status: reference_certified
exact_certification_registry: runtime-certifications.v1.json
generated_certification_schema: runtime-certifications.schema.json
canonical_for:
  - runtime and harness compatibility
  - adapter and driver path
  - entitlement semantics
  - verification state
  - known limitations
support_states:
  verified: Tested end to end against a specific adapter, driver, harness, protocol, and location combination.
  preview: Implemented and selectively available but not cleared by every production release gate.
  partially_verified: Some capabilities or provider semantics are confirmed, but the full Agent HQ path is not tested.
  degraded: Usable only with explicit documented capability limitations.
  planned: An intended integration path exists architecturally but has not been validated.
  untested: A discovered or recognized combination without current certification evidence.
  incompatible: A known version or capability combination that must not be selected.
  revoked: A previously known combination explicitly disabled by policy, security, or compatibility action.
  unsupported: Known not to satisfy the required capability or product policy.
  deprecated: Previously supported but no longer approved for new use.
rules:
  - Filter hard runtime eligibility before applying preference ranking.
  - ACP support is capability-negotiated and does not imply a uniform feature set.
  - Missing a required capability makes a runtime ineligible rather than silently degraded.
  - Native session ownership remains with the originating harness.
  - Provider and harness subscription entitlements are not assumed equivalent.
  - Certification is tied to the exact adapter, driver, harness or runtime, protocol, RuntimeNode location, and policy versions
    tested.
runtimes:
  - id: managed-pi
    display_name: Managed Pi
    kind: managed_harness
    support_state: verified
    integration_path:
      Managed local Pi through Runtime Gateway and ManagedPiDriver; hosted managed Pi is a separate RuntimeConnection
      and location.
    adapter: ManagedPiAdapter
    driver: ManagedPiDriver
    runtime_node_locations:
      - local_device
    runtime_gateway:
      required: true
      purpose: Control Plane commands and normalized RuntimeDriver results.
    authentication:
      Agent HQ-managed or user-authorized provider credentials or subscription authentication configured through
      Pi on the selected RuntimeNode.
    sessions:
      list: Control Plane-owned managed execution and session model; external native-session semantics do not apply.
      resume: Managed by Agent HQ and Pi execution state according to implementation.
      history_replay: Agent HQ controls managed context; not dependent on ACP.
    tools:
      Pi tools, skills, and extensions are exposed through canonical ToolDefinitions and the policy-controlled Tool Gateway;
      MCP and native integrations are adapters or executors rather than ambient authority.
    filesystem_shell:
      Available only through an active workspace-scoped LocalProjectGrant and allowlisted RuntimeDriver and
      Tauri operations.
    model_selection:
      Controlled for managed routes by ExecutionPlan policy, deterministic eligibility and routing, provider
      health, budget, data policy, and entitlement.
    entitlement_behavior:
      May use Agent HQ-funded API inference, user-provided API credentials, or selected provider subscription
      flows; semantics vary by provider.
    side_effect_semantics:
      Propagate downstream idempotency keys or reconcile authoritative status where supported. Ambiguous
      non-idempotent effects enter reconciliation_required and are not retried automatically.
    known_limitations:
      Must not be assumed to reproduce native harness-specific subscription or session behavior. Claude Pro
      or Max authentication through Pi does not currently consume native Claude plan limits in the same way as Claude Code.
    tested_versions:
      adapter: 1.0.0
      driver: 1.0.0
      runtime: 0.52.1
      protocol: 1.5.0
    last_verified: '2026-08-25'
    verification_notes: Disposable managed Pi and Runtime Gateway reference path certified; production Agent HQ remains a separate gate.
