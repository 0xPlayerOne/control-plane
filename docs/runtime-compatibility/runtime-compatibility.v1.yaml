production_readiness_checks:
  - Clean install or connect path succeeds.
  - Authentication behavior is documented.
  - RuntimeAdapter capability negotiation is tested.
  - RuntimeDriver and Runtime Gateway versions are tested for node-hosted execution.
  - Required tools, environment access, and LocalProjectGrant enforcement are tested.
  - Session list, resume, and history behavior are explicitly classified.
  - Cancellation, reconnect, duplicate delivery, and disconnect recovery are tested.
  - Downstream side-effect semantics are classified and ambiguous non-idempotent outcomes enter reconciliation_required.
  - Permission enforcement is validated.
  - Errors normalize into the Control Plane taxonomy.
  - Usage, cost, and entitlement attribution is validated where observable.
  - Native configuration is not silently mutated.
  - Exact adapter, driver, gateway, runtime or harness, protocol, location, and policy versions are recorded.
  - RuntimeAdapter conformance, M6 compatibility certification, representative regression coverage, and configured M9 release
    gates pass.
open_items:
  - Exact ACP support matrix for Claude Code, Codex, OpenCode, and user-managed Pi.
  - Concrete Runtime Gateway deployment, autoscaling, secure-storage adapters, and operational thresholds.
  - Provider entitlement verification strategy.
runtime_location_semantics:
  Compatibility is evaluated with RuntimeNode location. The same harness is not interchangeable
  across local_device, future agent_hq_cloud, or remote_host locations merely because its name matches.
milestone_ownership:
  M4: RuntimeConnection inventory, capability freshness, eligibility, routing, and ExternalSession read models.
  M6: Managed Pi and ACP implementation, conformance evidence, and machine-readable compatibility certification.
  M9:
    Evaluation and release gates that may block promotion on compatibility, reliability, security, quality, latency, or
    cost regressions.
