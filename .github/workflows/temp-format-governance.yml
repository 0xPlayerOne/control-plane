name: Temporary Governance Formatting

on:
  push:
    branches:
      - docs/runtime-governance

permissions:
  contents: write

concurrency:
  group: temporary-governance-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/runtime-governance
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatting
        run: bun run format

      - name: Remove temporary workflow and commit formatting
        run: |
          rm -f .github/workflows/temp-format-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply repository formatting"
          git push origin HEAD:docs/runtime-governance
