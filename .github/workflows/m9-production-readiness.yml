name: M9 Production Readiness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m9-production-readiness-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Core hardening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test:unit
      - run: bun run test:isolation-matrix
      - run: bun run test:secret-canaries
      - run: bun run test:m9-acceptance
      - run: bun audit

  integration-recovery:
    name: Integration and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:recovery-matrix

  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: >-
          docker run --rm --volume "$PWD:/workspace"
          --workdir /workspace/infrastructure/terraform
          hashicorp/terraform:1.13.5 fmt -check -recursive -diff
      - run: >-
          docker run --rm --volume "$PWD:/workspace"
          --workdir /workspace/infrastructure/terraform/environments/${{ matrix.environment }}
          hashicorp/terraform:1.13.5 init -backend=false -input=false -no-color
      - run: >-
          docker run --rm --volume "$PWD:/workspace"
          --workdir /workspace/infrastructure/terraform/environments/${{ matrix.environment }}
          hashicorp/terraform:1.13.5 validate -no-color

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: >-
          docker buildx bake -f infrastructure/containers/docker-bake.hcl
          default database-migrate

  # Stable required check: M9 Production Readiness / Gate
  gate:
    name: Gate
    if: always()
    needs: [containers, core, integration-recovery, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_RESULT: ${{ needs.core.result }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
      INTEGRATION_RESULT: ${{ needs.integration-recovery.result }}
      TERRAFORM_RESULT: ${{ needs.terraform.result }}
    steps:
      - name: Require every M9 lane
        run: |
          test "$CORE_RESULT" = success
          test "$CONTAINERS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$TERRAFORM_RESULT" = success
