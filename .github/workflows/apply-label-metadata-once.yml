name: Apply label metadata once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-label-metadata-once.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    name: Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      CODE_FOUNDRY_TOKEN: ${{ secrets.CODE_FOUNDRY_TOKEN }}
      REPOSITORY_TOKEN: ${{ github.token }}
    steps:
      - name: Update live label metadata in both repositories
        shell: bash
        run: |
          set -euo pipefail

          labels_file="$RUNNER_TEMP/labels.txt"
          cat >"$labels_file" <<'LABELS'
          type:feature|0E8A16|Product or platform behavior implemented as a feature.
          type:test|5319E7|Tests, fixtures, conformance suites, or acceptance validation.
          type:infrastructure|0052CC|Infrastructure, deployment, database provisioning, CI, or operational foundations.
          type:documentation|0075CA|Documentation-only work with no runtime behavior change.
          area:frontend|C5DEF5|Web, desktop, mobile, UI, or client-state work.
          area:backend|BFDADC|Application services, APIs, workers, or server-side behavior.
          area:data|D4C5F9|Persistence, schemas, migrations, repositories, or durable state.
          area:runtime|F9D0C4|Runtime fabric, Runtime Gateway, RuntimeDrivers, adapters, or harness integration.
          area:security|B60205|Authentication, authorization, trust, credentials, secrets, or isolation.
          area:realtime|FBCA04|Events, SSE, replay, ordering, reconnect, or live synchronization.
          area:spatial|A2EEEF|Three.js scene runtime, spatial presentation, assets, or scene lifecycle.
          area:observability|7057FF|Telemetry, diagnostics, evaluation, performance, or operational evidence.
          area:integration|1D76DB|Cross-service contracts, SDKs, external systems, or repository integration.
          cross-repo|D93F0B|Requires coordinated changes or acceptance evidence across Agent HQ and Control Plane.
          worktree-safe|C2E0C6|Can proceed in an isolated worktree once declared dependencies are satisfied.
          blocked|D73A4A|Cannot proceed because of an unresolved dependency, decision, or external constraint.
          LABELS

          apply_labels() {
            local repo="$1"
            local token="$2"
            local name color description encoded

            while IFS='|' read -r name color description; do
              [[ -z "$name" ]] && continue
              encoded="$(python3 - "$name" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=""))
          PY
              )"

              if GH_TOKEN="$token" gh api "repos/$repo/labels/$encoded" >/dev/null 2>&1; then
                if ! GH_TOKEN="$token" gh api --method PATCH "repos/$repo/labels/$encoded" \
                  -f new_name="$name" \
                  -f color="$color" \
                  -f description="$description" >/dev/null; then
                  return 1
                fi
              else
                if ! GH_TOKEN="$token" gh api --method POST "repos/$repo/labels" \
                  -f name="$name" \
                  -f color="$color" \
                  -f description="$description" >/dev/null; then
                  return 1
                fi
              fi
            done <"$labels_file"
          }

          verify_labels() {
            local repo="$1"
            local token="$2"
            local name color description encoded actual_color actual_description

            while IFS='|' read -r name color description; do
              [[ -z "$name" ]] && continue
              encoded="$(python3 - "$name" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=""))
          PY
              )"
              actual_color="$(GH_TOKEN="$token" gh api "repos/$repo/labels/$encoded" --jq '.color')"
              actual_description="$(GH_TOKEN="$token" gh api "repos/$repo/labels/$encoded" --jq '.description // ""')"
              [[ "${actual_color^^}" == "$color" ]]
              [[ "$actual_description" == "$description" ]]
            done <"$labels_file"
          }

          update_repository() {
            local repo="$1"
            local token

            for token in "$RELEASE_PLEASE_TOKEN" "$CODE_FOUNDRY_TOKEN" "$REPOSITORY_TOKEN"; do
              [[ -z "$token" ]] && continue
              if GH_TOKEN="$token" gh api "repos/$repo/labels?per_page=1" >/dev/null 2>&1 && \
                 apply_labels "$repo" "$token" && \
                 verify_labels "$repo" "$token"; then
                printf 'Updated and verified 16 labels in %s\n' "$repo"
                return 0
              fi
            done

            printf 'No available token could update %s\n' "$repo" >&2
            return 1
          }

          update_repository 0xPlayerOne/agent-hq
          update_repository 0xPlayerOne/control-plane
