version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # Code Foundry runtime pins are sync-managed (runtime_ref in
      # code-foundry.yml). Dependabot must never bump them; a stale
      # github-actions group PR branched before a sync can resurrect
      # legacy caller files when merged.
      - dependency-name: '0xPlayerOne/code-foundry*'
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # Keep runtime and type declarations aligned with the supported Node line.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 currently declares TypeScript support below 6.1.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Nest's Fastify adapter installs this exact version; a different direct
      # version creates incompatible duplicate Fastify types.
      - dependency-name: 'fastify'
        versions: ['>5.11.3']
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: pip
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ['*']
